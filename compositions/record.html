<!-- A self-contained, generic five-second motion test. No documentary assets. -->
<template id="record-template">
  <div data-composition-id="record" data-width="1920" data-height="1080">
    <style>
      [data-composition-id="record"] .record-card {
        position: absolute;
        left: 260px;
        top: 250px;
        width: 1400px;
        height: 620px;
        padding: 76px 82px;
        border-radius: 22px;
        background: #f3f0e8;
        color: #202226;
        box-shadow: 0 28px 80px rgba(0, 0, 0, .28);
        opacity: 0;
      }
      [data-composition-id="record"] .record-label {
        color: #77766f;
        font: 18px/1.2 monospace;
        letter-spacing: .16em;
      }
      [data-composition-id="record"] .separator {
        height: 1px;
        margin-top: 30px;
        background: #c9c5bc;
      }
      [data-composition-id="record"] .headline {
        margin: 72px 0 0;
        font-size: 76px;
        line-height: 1.06;
        font-weight: 600;
        letter-spacing: -.035em;
        opacity: 0;
      }
      [data-composition-id="record"] .subline {
        margin-top: 28px;
        color: #686860;
        font-size: 30px;
        line-height: 1.35;
      }
      [data-composition-id="record"] .rule {
        width: 100%;
        height: 8px;
        margin-top: 54px;
        border-radius: 8px;
        background: #d1cec6;
      }
      [data-composition-id="record"] .signature {
        position: absolute;
        left: 82px;
        bottom: 66px;
        display: flex;
        align-items: center;
        gap: 22px;
        color: #9a7745;
        font-size: 28px;
        font-weight: 600;
      }
      [data-composition-id="record"] .check {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border: 2px solid #b18b4c;
        border-radius: 50%;
        font-size: 34px;
      }
      [data-composition-id="record"] .footer {
        position: absolute;
        right: 82px;
        bottom: 76px;
        color: #77766f;
        font: 17px/1.5 monospace;
        opacity: 0;
      }
      [data-composition-id="record"] .accent-dot {
        position: absolute;
        right: 0;
        top: 0;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #c49d5b;
        box-shadow: 0 0 24px rgba(196, 157, 91, .45);
      }
    </style>

    <section class="record-card">
      <div class="record-label">RECORD / ILLUSTRATIVE</div>
      <div class="separator"></div>
      <h1 class="headline">A verified record.</h1>
      <div class="subline">A five-second browser, animation and MP4 pipeline test.</div>
      <div class="rule"></div>
      <div class="signature">
        <span class="check">✓</span>
        <span>Render pipeline ready</span>
      </div>
      <div class="footer">1920 × 1080<br>30 FRAMES / SECOND</div>
      <div class="accent-dot"></div>
    </section>

    <script>
      const recordTl = gsap.timeline({ paused: true });
      recordTl.fromTo(
        ".record-card",
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0
      );
      recordTl.fromTo(
        ".headline",
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" },
        0.45
      );
      recordTl.fromTo(
        ".rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.9, ease: "power2.out" },
        1.25
      );
      recordTl.fromTo(
        ".footer",
        { opacity: 0 },
        { opacity: 1, duration: 0.35 },
        3.25
      );
      recordTl.fromTo(
        ".accent-dot",
        { scale: 0.4, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.7)" },
        3.8
      );
      recordTl.to({}, { duration: 0.8 }, 4.2);
      window.__timelines = window.__timelines || {};
      window.__timelines.record = recordTl;
    </script>
  </div>
</template>
