<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyperFrames + GSAP Smoke Test</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #17191d;
      color: #f3f0e8;
      font-family: Arial, sans-serif;
    }
    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 78% 20%, rgba(196,157,91,.10), transparent 38%),
        #17191d;
    }
    .eyebrow {
      position: absolute;
      left: 120px;
      top: 88px;
      color: #aeb1b3;
      font: 22px/1.2 monospace;
      letter-spacing: .18em;
    }
  </style>
  <script src="./node_modules/gsap/dist/gsap.min.js"></script>
</head>
<body>
  <div id="root"
       data-composition-id="root"
       data-start="0"
       data-width="1920"
       data-height="1080"
       data-fps="30">
    <div class="eyebrow">RENDER TEST / HYPERFRAMES + GSAP</div>

    <div id="el-record"
         class="clip"
         data-composition-id="record"
         data-composition-src="compositions/record.html"
         data-start="0"
         data-duration="5"
         data-track-index="0"></div>

    <script>
      // The root owns the project timeline; the animated card is a registered sub-composition.
      const rootTl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines.root = rootTl;
    </script>
  </div>
</body>
</html>
